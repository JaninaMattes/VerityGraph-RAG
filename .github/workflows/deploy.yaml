name: Run Deploy Backend to AWS

on:
  # Only trigger if your existing "Run Unit Test via Pytest" workflow passes
  workflow_run:
    workflows: ["Run Unit Test via Pytest"]
    types:
      - completed
    branches: [main, master]

jobs:
  build-and-push:
    name: Build and Push Universal Backend Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}