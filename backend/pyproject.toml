[project]
name = "veritygraph-backend"
version = "0.1.0"
description = "VerityGraph backend: FastAPI service and the Temporal/Kafka ingestion worker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[all,standard]>=0.139.0",
    "minio>=7.2.20",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "temporalio>=1.30.0",
    "uvicorn>=0.52.4",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
]

[project.optional-dependencies]
# Parsing and chunking for the ingestion worker. It pulls in torch, so the API
# image does not install it (uv sync --extra ingestion).
ingestion = [
    "docling>=2.150.0",
    # Direct, so that [tool.uv.sources] applies (uv ignores it for transitive ones).
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

# On Linux (CI, Docker) use the CPU-only torch wheels: no CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.fastapi]
entrypoint = "src.main:app"

# A [tool.ruff] table makes this file Ruff's config, so backend/ is the project
# root wherever Ruff runs (CLI or editor) and `src` and `tests` sort as first-party.
[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship targets by name, so the models import each
# other only for type checking; moving those imports out causes a circular import.
"src/infrastructure/database/postgres/models/*" = ["TC004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run every async test and fixture with pytest-asyncio, without per-test markers.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "raise NotImplementedError",  # Protocol method bodies
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
