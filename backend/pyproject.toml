[project]
name = "uv-fastapi-backend"
version = "0.1.0"
description = "Fast API project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "alembic>=1.18.5",
    "fastapi[all,standard]>=0.139.0",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "postgres>=4.0",
    "prometheus-client>=0.25.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.22",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "temporalio>=1.30.0",
    "torch>=2.13.0",
    "transformers>=5.13.1",
]

[tool.fastapi]
entrypoint = "src.main:app"
