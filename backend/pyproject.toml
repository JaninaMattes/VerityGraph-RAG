[project]
name = "veritygraph-backend"
version = "0.1.0"
description = "VerityGraph backend: FastAPI service and the Temporal/Kafka ingestion worker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[all,standard]>=0.139.0",
    "minio>=7.2.20",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "temporalio[langgraph]>=1.30.0",
    "uvicorn>=0.52.4",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "raise NotImplementedError",  # Protocol method bodies
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
