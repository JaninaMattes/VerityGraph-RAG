  #   #   MB_DB_USER: ${POSTGRES_USER}
  #   #   MB_DB_PASS: ${POSTGRES_PASSWORD}
  #   ports:
  #     - "5434:3000"
  #   networks:
  #     - service-network


# =========================================================================
# VOLUMES & NETWORKS
# =========================================================================
volumes:
  postgres-data:      
    driver: local
  postgresql-data:      
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  kafka-data: # for logs
    driver: local
  temporal-data:
    driver: local
  pgadmin-working-dir:
    driver: local  

networks:
  service-network:
    driver: bridge
    name: service-network