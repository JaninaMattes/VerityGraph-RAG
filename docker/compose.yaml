    #   MB_DB_USER: ${POSTGRES_USER}
    #   MB_DB_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "5434:3000"
    networks:
      - service_network


# =========================================================================
# VOLUMES & NETWORKS
# =========================================================================
volumes:
  postgres_data:      
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  kafka_data: # for logs
   driver: local
  # neo4j_data:    
  #   driver: local
  # qdrant_data:       
  #   driver: local
  pgadmin_working_dir:
    driver: local  

networks:
  service_network:
    driver: bridge