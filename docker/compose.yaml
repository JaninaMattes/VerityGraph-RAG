services:
  # =========================================================================
  # 1. METADATA & SYSTEM STATE (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_MULTIPLE_DATABASES: "${POSTGRES_DB},${POSTGRES_DB_METABASE}" 
    ports:
      - "5432:5432"
    networks:
      - service_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # 2. CACHE (Redis)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    networks:
      - service_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # 3. BLOB STORAGE (MinIO) - REQUIRED FOR YOUR ARCHITECTURE
  # =========================================================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio
    depends_on:
      kafka-kraft:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - minio_data:/data
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
      MINIO_NOTIFY_KAFKA_QUEUE_DIR_PRIMARY: ${MINIO_NOTIFY_KAFKA_QUEUE_DIR_PRIMARY}
      MINIO_NOTIFY_KAFKA_QUEUE_LIMIT_PRIMARY: ${MINIO_NOTIFY_KAFKA_QUEUE_LIMIT_PRIMARY}
      MINIO_NOTIFY_KAFKA_BATCH_SIZE_PRIMARY: ${MINIO_NOTIFY_KAFKA_BATCH_SIZE_PRIMARY}
      MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY: ${MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY} # MINIO_NOTIFY_KAFKA_ENABLE_<IDENTIFIER>
      MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY: ${MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY} # single primary broker for dev environment
      MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY: ${MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY}
    command: [ "server", "--console-address", ":9001", "/data" ]
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    networks:
      - service_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auto-create buckets and attach Kafka notifications on startup
  minio-init-buckets:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: minio-init-buckets
    depends_on:
      minio:
        condition: service_healthy
      kafka-kraft:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      echo 'Setting MinIO alias...';
      /usr/bin/mc alias set dockerminio ${MINIO_URL} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      
      echo 'Creating default bucket...';
      /usr/bin/mc mb dockerminio/${MINIO_DEFAULT_BUCKETS:-files} --ignore-existing;
      
      echo 'Binding Kafka events to bucket...';
      /usr/bin/mc event add dockerminio/${MINIO_DEFAULT_BUCKETS:-files} arn:minio:sqs::primary --event put,delete;
      echo 'MinIO Kafka integration configured successfully';
      
      echo 'Verifying bucket event configuration:';
      /usr/bin/mc event list dockerminio/${MINIO_DEFAULT_BUCKETS:-files};
      
      exit 0;
      "
    networks:
      - service_network


  # =========================================================================
  # 4. MESSAGE BROKER (Apache Kafka - KRaft Mode)
  # =========================================================================
  kafka-kraft:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka-kraft
    hostname: kafka-kraft
    env_file:
      - .env
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-kraft:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-kraft:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}   # Set to 1 for a single-node cluster
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR}               # Set to 1 for a single-node cluster
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS}                             # Set to 1 for a single-node cluster
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - service_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Auto-create topics on startup
  kafka-init-topics:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka-init-topics
    depends_on:
      kafka-kraft:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "echo 'Waiting for Kafka to be fully ready...' &&
      sleep 5 &&
      echo 'Creating topic ${MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY}' &&
      kafka-topics --bootstrap-server kafka-kraft:9092 --create --if-not-exists --topic ${MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY} --partitions 1 --replication-factor 1 &&
      echo 'Kafka topics initialized successfully.'"
    networks:
      - service_network

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: ${DYNAMIC_CONFIG_ENABLED}
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTERS_0_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-kraft:9092'
    depends_on:
      kafka-kraft:
        condition: service_healthy
    networks:
      - service_network

