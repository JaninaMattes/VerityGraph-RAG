services:
  # =========================================================================
  # 1. METADATA & SYSTEM STATE (PostgreSQL)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount the initialise multiple-databases script
      - ./scripts/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh:ro
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - "5432:5432"
    networks:
      - service-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # 2. CACHE (Redis)
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    env_file:
      - .env
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - service-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # 3. BLOB STORAGE (MinIO) - REQUIRED FOR YOUR ARCHITECTURE
  # =========================================================================
  minio:
    image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio
    depends_on:
      kafka-kraft:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - minio-data:/data
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_KAFKA_QUEUE_DIR_PRIMARY: ${MINIO_NOTIFY_KAFKA_QUEUE_DIR_PRIMARY}
      MINIO_NOTIFY_KAFKA_QUEUE_LIMIT_PRIMARY: ${MINIO_NOTIFY_KAFKA_QUEUE_LIMIT_PRIMARY}
      MINIO_NOTIFY_KAFKA_BATCH_SIZE_PRIMARY: ${MINIO_NOTIFY_KAFKA_BATCH_SIZE_PRIMARY}
      MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY: ${MINIO_NOTIFY_KAFKA_ENABLE_PRIMARY} # MINIO_NOTIFY_KAFKA_ENABLE_<IDENTIFIER>
      MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY: ${MINIO_NOTIFY_KAFKA_BROKERS_PRIMARY} # Single primary broker for dev environment
      MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY: ${MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY}
    command: [ "server", "--console-address", ":9001", "/data" ]
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    networks:
      - service-network
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Auto-create buckets and attach Kafka notifications on startup
  minio-init-buckets:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: minio-init-buckets
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 ${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb dockerminio/${MINIO_DEFAULT_BUCKETS};
      /usr/bin/mc event add dockerminio/${MINIO_DEFAULT_BUCKETS} arn:minio:sqs::PRIMARY:kafka --event put,delete;
      exit 0;
      "
    networks:
      - service-network

  # =========================================================================
  # 4. MESSAGE BROKER (Apache Kafka - KRaft Mode)
  # =========================================================================
  kafka-kraft:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka-kraft
    hostname: kafka-kraft
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CLUSTER_ID: ${CLUSTER_ID}
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-kraft:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-kraft:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}   # Set to 1 for a single-node cluster
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR}               # Set to 1 for a single-node cluster
      KAFKA_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS}                             # Set to 1 for a single-node cluster
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - service-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Auto-create topics on startup
  kafka-init-topics:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka-init-topics
    restart: "no" # Run once and exit
    env_file:
      - .env
    depends_on:
      kafka-kraft:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka-kraft:9092 --create --if-not-exists --topic ${MINIO_NOTIFY_KAFKA_TOPIC_PRIMARY} --partitions 1 --replication-factor 1;
      exit 0;
      "
    networks:
      - service-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DYNAMIC_CONFIG_ENABLED: ${DYNAMIC_CONFIG_ENABLED}
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTERS_0_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-kraft:9092'
    depends_on:
      kafka-kraft:
        condition: service_healthy
    networks:
      - service-network

  # =========================================================================
  # 5. STATELESS ORCHESTRATION (TEMPORAL.io)
  # =========================================================================
  temporal:
    image: temporalio/server:1.32.0
    container_name: temporal
    restart: unless-stopped
    ports:
      - "7233:7233"  # gRPC port for Client.connect()
    env_file:
      - .env
    environment:
      # PostgreSQL persistence (required - Temporal doesn't use Kafka for state)
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=${POSTGRES_SEEDS}
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TEMPORAL_POSTGRES_DB}

      # Visibility Database Credentials
      - POSTGRES_VISIBILITY_USER=${TEMPORAL_POSTGRES_USER}
      - POSTGRES_VISIBILITY_PWD=${TEMPORAL_POSTGRES_PASSWORD}
      - POSTGRES_VISIBILITY_DB=${TEMPORAL_POSTGRES_VISIBILITY_DB}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - SKIP_SCHEMA_SETUP=${SKIP_SCHEMA_SETUP} # Set to 'true'; Schema is initialised in the Temporal server container
    volumes:
      - temporal-data:/etc/temporal/config/dynamicconfig
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    networks:
      - service-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  temporal-schema-setup:
    image: temporalio/admin-tools:1.32.0
    container_name: temporal-schema-setup
    env_file:
      - .env
    environment:
      - DB_PORT=5432
      - POSTGRES_SEEDS=${POSTGRES_SEEDS}
      - TEMPORAL_USER=${TEMPORAL_POSTGRES_USER}
      - TEMPORAL_PASSWORD=${TEMPORAL_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TEMPORAL_POSTGRES_DB}
      - POSTGRES_VISIBILITY_DB=${TEMPORAL_POSTGRES_VISIBILITY_DB}
    volumes:
      - ./scripts/setup-temporal-postgres.sh:/scripts/setup-temporal-postgres.sh:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-temporal-postgres.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - service-network


  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    restart: unless-stopped
    ports:
      - "8081:8080"  # Web UI for workflow monitoring
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_URL}
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGIN} # React frontend, FastAPI backend
    depends_on:
      - temporal
    networks:
      - service-network

