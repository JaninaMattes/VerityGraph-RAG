# =========================================================================
# VOLUMES & NETWORKS
# =========================================================================
volumes:
  postgres-data:      
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  kafka-data: # for logs
    driver: local
  temporal-data:
    driver: local
  # neo4j-data:    
  #   driver: local
  # qdrant-data:       
  #   driver: local
  pgadmin-working-dir:
    driver: local  

networks:
  service-network:
    driver: bridge
    name: service-network