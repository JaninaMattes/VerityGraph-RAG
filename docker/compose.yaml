# =========================================================================
# VOLUMES & NETWORKS
# =========================================================================
volumes:
  postgres_data:      
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local      
  # neo4j_data:    
  #   driver: local
  # qdrant_data:       
  #   driver: local
  pgadmin_working_dir:
    driver: local  

networks:
  service_network:
    driver: bridge